name: AI Fix

on:
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Jira issue key (e.g. KAN-2)"
        required: true
        type: string
      summary:
        description: "Jira issue summary"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  ai-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Jira ticket ${{ inputs.issue_key }}: "${{ inputs.summary }}"

            1. Find the root cause of this bug in the code.
            2. Fix it with a minimal change.
            3. Add or update a regression test.
            4. Run `npx tsc --noEmit` and `npm test`. Both must pass.
            5. Create a branch `fix/${{ inputs.issue_key }}`, commit, and push it.
            6. Open a pull request to `main` with `gh pr create`. Mention ${{ inputs.issue_key }} in the title.
            7. Enable auto-merge with `gh pr merge --auto --merge`.
            Do not merge manually.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*)"
