name: Notify Jira on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify-jira:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'fix/')
    runs-on: ubuntu-latest
    steps:
      - name: Send merge info to Jira
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          JIRA_WEBHOOK_URL: ${{ secrets.JIRA_WEBHOOK_URL }}
          JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
        run: |
          ISSUE_KEY="${BRANCH#fix/}"
          if ! [[ "$ISSUE_KEY" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]]; then
            echo "Branch '$BRANCH' does not contain a valid Jira key. Skipping."
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg key "$ISSUE_KEY" \
            --arg url "$PR_URL" \
            --arg title "$PR_TITLE" \
            '{issues: [$key], pr_url: $url, pr_title: $title}')
          curl --fail-with-body -sS -X POST "$JIRA_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: $JIRA_WEBHOOK_SECRET" \
            -d "$PAYLOAD"
